<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrategyIndex — Simulación de estrategias</title>
<style>
:root{--bg:#0b1220;--card:#141d31;--card2:#0f1729;--txt:#e9eff9;--mut:#8ea0bd;--up:#22c55e;--dn:#ef4444;--acc:#4f7cff;--line:#22314f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Inter",system-ui,-apple-system,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 18px;background:#080e1a;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:.3px}
.logo svg{filter:drop-shadow(0 2px 6px rgba(79,124,255,.5))}
.badge{padding:3px 12px;border-radius:20px;font-size:12px;background:#222f4d;color:var(--mut);transition:all .3s}
.badge.on{background:rgba(34,197,94,.15);color:var(--up)}.badge.off{background:rgba(239,68,68,.15);color:var(--dn)}
.hspace{flex:1}
button{font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:9px;padding:8px 16px;cursor:pointer;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
main{max-width:1150px;margin:0 auto;padding:18px 16px 60px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.filters input,.filters select,form.adm input,form.adm select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;animation:fade .4s}
.card:hover{transform:translateY(-3px);border-color:var(--acc);box-shadow:0 8px 28px rgba(79,124,255,.15)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.card h3{margin:0 0 2px;font-size:16.5px;display:flex;align-items:center;gap:8px}
.card .sym{color:var(--mut);font-size:12.5px;display:flex;gap:6px;align-items:center}
.big{font-size:26px;font-weight:800;margin:6px 0 0}
.pnl{font-weight:700}.up{color:var(--up)}.dn{color:var(--dn)}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:5px 0;border-top:1px solid rgba(34,49,79,.6)}
.stat span:first-child{color:var(--mut)}
.st{display:inline-block;font-size:11.5px;padding:2px 10px;border-radius:12px}
.st.running{background:rgba(34,197,94,.15);color:var(--up)}.st.stopped{background:rgba(142,160,189,.15);color:var(--mut)}
section.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:16px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
canvas.chart{width:100%;height:220px;background:#080e1a;border-radius:10px;border:1px solid var(--line)}
h2.sec{font-size:18px;margin:22px 0 4px}.k{color:var(--mut);font-size:12.5px}
.skel{border-radius:14px;background:linear-gradient(90deg,#141d31 25%,#1d2a47 50%,#141d31 75%);background-size:200% 100%;animation:sh 1.2s infinite;min-height:170px}
@keyframes sh{to{background-position:-200% 0}}
.empty,.error{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mut)}
.error{color:var(--dn);border-color:var(--dn)}
form.adm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}
.tabs{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:9px;padding:7px 14px;cursor:pointer}
.tabs button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.hidden{display:none!important}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:640px){.big{font-size:22px}td,th{font-size:12px}}
</style>
</head>
<body>
<header>
<div class="logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 3 6-8" stroke="#4f7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 6h-4M18 6v4" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/><circle cx="3" cy="17" r="1.6" fill="#4f7cff"/><circle cx="18" cy="6" r="1.6" fill="#22c55e"/></svg>StrategyIndex</div>
<span id="cConn" class="badge off">conectando…</span><div class="hspace"></div>
<span id="who" class="k"></span><button id="btnAdm" class="btn ghost">Admin</button>
</header>
<main>
<div id="viewPub">
<div class="filters">
<input id="fBot" placeholder="Buscar bot…" oninput="renderPub()">
<select id="fSym" onchange="renderPub()"><option value="">Símbolo: todos</option></select>
<select id="fTf" onchange="renderPub()"><option value="">TF: todos</option><option>1m</option><option>5m</option><option>15m</option><option>30m</option><option>1h</option><option>4h</option></select>
<select id="fPer" onchange="renderPub()"><option value="">Periodo: todo</option><option value="7">7 días</option><option value="30">30 días</option></select>
</div>
<div id="pubList"><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></div>
<section id="pubDetail" class="panel hidden"></section>
</div>
<div id="viewAdm" class="hidden">
<div id="admLogin" class="panel"><b>Acceso administrador</b><div class="row" style="margin-top:10px">
<input id="admTok" type="password" placeholder="Admin token"><button class="btn" onclick="admLogin()">Entrar</button></div>
<div class="k">Solo lectura pública sin token. El token vive en el servidor (ADMIN_TOKEN).</div></div>
<div id="admBody" class="hidden">
<div class="tabs"><button class="sel" onclick="admTab('bots',this)">Bots</button><button onclick="admTab('new',this)">Crear bot</button><button onclick="admTab('mkt',this)">Market Data</button></div>
<div id="admBots"></div>
<div id="admNew" class="hidden"><section class="panel"><b>Crear bot (timeframe fijo, sin cambios posteriores)</b>
<form class="adm" id="frmBot">
<select name="strategy_key"><option value="irk">Index Range Killer (EMA75/150)</option><option value="irk_plus">Index Range Killer + (EMA30/75/150)</option></select>
<input name="symbol" value="frxXAUUSD" required><input name="timeframe" value="5m" required>
<input name="capital" type="number" value="50" step="1"><input name="lot" type="number" value="0.01" step="0.001">
<input name="max_positions" type="number" value="1" min="1"><input name="spread" type="number" value="0.0001" step="0.0001">
<input name="commission" type="number" value="0.0005" step="0.0001">
</form><button class="btn" onclick="createBot()">Crear</button><div id="admMsg" class="k"></div></section></div>
<div id="admDetail"></div>
<div id="admMkt" class="hidden"><section class="panel"><b>Market Data (CoinMarketCap)</b><div id="mktInfo" class="k"></div>
<div class="row" style="margin:10px 0"><button class="btn" onclick="mktSync()">Sync Assets</button>
<input id="mktQ" placeholder="Buscar: Tesla, Gold, BTC…"><button class="btn ghost" onclick="mktSearch()">Buscar</button>
<button class="btn ghost" onclick="mktResolve()">Resolver</button></div>
<div id="mktOut"></div></section></div>
</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
let BOTS=[],SEL=null,ADM=sessionStorage.getItem("adm")||"";
const H=h=>fetch(h,{headers:ADM?{"X-Admin-Token":ADM}:{}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
const J=(u,b,m)=>fetch(u,{method:m||"POST",headers:Object.assign({"Content-Type":"application/json"},ADM?{"X-Admin-Token":ADM}:{}),body:JSON.stringify(b)}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
$("btnAdm").onclick=()=>{const pub=$("viewPub").classList.contains("hidden");$("viewPub").classList.toggle("hidden",!pub);$("viewAdm").classList.toggle("hidden",pub);$("btnAdm").textContent=pub?"Vista pública":"Admin";if(!pub&&ADM)admLoad();};
function skel(el,n){$(el).innerHTML='<div class="grid">'+('<div class="skel"></div>'.repeat(n||3))+"</div>";}
async function boot(){try{BOTS=await H("/api/bots");const sy=[...new Set(BOTS.map(b=>b.symbol))];$("fSym").innerHTML='<option value="">Símbolo: todos</option>'+sy.map(s=>`<option>${s}</option>`).join("");renderPub();}catch(e){$("pubList").innerHTML='<div class="error">Error cargando bots. Reintenta.</div>';}$("cConn").textContent="en línea";$("cConn").className="badge on";}
function renderPub(){
const f=($("fBot").value||"").toLowerCase();
const list=BOTS.filter(b=>(!f||b.name.toLowerCase().includes(f))&&(!$("fSym").value||b.symbol===$("fSym").value)&&(!$("fTf").value||b.timeframe===$("fTf").value));
if(!list.length){$("pubList").innerHTML='<div class="empty">Sin bots para este filtro.</div>';return;}
$("pubList").innerHTML='<div class="grid">'+list.map(b=>`<div class="card" onclick="detail('${b.bot_id}')">
<h3><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 3 6-8" stroke="#4f7cff" stroke-width="2.5" stroke-linecap="round"/></svg>${b.name}</h3>
<div class="sym">${b.symbol} · ${b.timeframe} · <span class="st ${b.status}">${b.status}</span> <span class="st ${b.state==="RUNNING"?"running":"stopped"}">${b.state||""}</span></div>
<div class="big">$${b.balance.toFixed(2)}</div>
<div class="pnl ${b.pnl>=0?"up":"dn"}">${b.pnl>=0?"+":""}${b.pnl_pct}% · $${b.pnl.toFixed(2)}</div>
<div class="stat"><span>Operaciones</span><b>${b.total}</b></div>
<div class="stat"><span>Win rate</span><b>${b.win_rate}%</b></div>
<div class="stat"><span>Max DD</span><b>${b.max_drawdown}%</b></div>
<div class="k">Ver rendimiento →</div></div>`).join("")+"</div>";
}
async function detail(id){SEL=id;const el=$("pubDetail");el.classList.remove("hidden");el.innerHTML='<div class="skel"></div>';
try{const[st,h]=await Promise.all([H(`/api/bots/${id}/stats`),H(`/api/bots/${id}/history?limit=200`)]);
const b=BOTS.find(x=>x.bot_id===id)||{};
el.innerHTML=`<h3>${b.name||id}</h3><div class="k">${b.symbol||""} · ${b.timeframe||""} · Strategy: Private</div>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin:10px 0">
${[["Balance","$"+st.balance],["Equity","$"+st.equity],["P&L",st.pnl+" ("+st.pnl_pct+"%)"],["Win rate",st.win_rate+"%"],["Profit factor",st.profit_factor],["Max DD",st.max_drawdown+"%"],["Expectancy",st.expectancy],["Racha W/L",st.max_win_streak+"/"+st.max_loss_streak]].map(x=>`<div><div class="k">${x[0]}</div><div style="font-size:18px;font-weight:700">${x[1]}</div></div>`).join("")}</div>
<h4>Equity</h4><canvas class="chart" id="cEq"></canvas>
<h4>Drawdown %</h4><canvas class="chart" id="cDd"></canvas>
<h4>Resultado por operación</h4><canvas class="chart" id="cTr"></canvas>
<h4>Historial (${h.length})</h4><table><tr><th>Dir</th><th>Entrada</th><th>Salida</th><th>P&L</th><th>P&L%</th></tr>${h.slice(0,60).map(t=>`<tr><td>${t.direction}</td><td>${t.entry}</td><td>${t.exit}</td><td class="${t.pnl>=0?"up":"dn"}">${t.pnl}</td><td>${t.pnl_pct}</td></tr>`).join("")||'<tr><td colspan="5">Sin operaciones todavía.</td></tr>'}</table>`;
line("cEq",st.equity_curve,"#4f7cff");line("cDd",st.drawdown_curve,"#ef4444");bars("cTr",st.per_trade);
el.scrollIntoView({behavior:"smooth"});
}catch(e){el.innerHTML='<div class="error">Error cargando detalle.</div>';}}
function line(id,data,col){const c=$(id),g=c.getContext("2d");g.clearRect(0,0,c.width,220);if(!data||!data.length){g.fillStyle="#8ea0bd";g.fillText("Sin datos todavía.",20,30);return;}const mn=Math.min(...data),mx=Math.max(...data);g.strokeStyle=col;g.lineWidth=2;g.beginPath();data.forEach((v,i)=>{const x=10+i*(c.width-20)/(data.length-1||1),y=200-(v-mn)/(mx-mn||1)*180;i?g.lineTo(x,y):g.moveTo(x,y);});g.stroke();}
function bars(id,data){const c=$(id),g=c.getContext("2d");g.clearRect(0,0,c.width,220);if(!data||!data.length){g.fillStyle="#8ea0bd";g.fillText("Sin datos todavía.",20,30);return;}const mx=Math.max(...data.map(Math.abs),1);data.slice(-80).forEach((v,i)=>{const w=c.width/80;g.fillStyle=v>=0?"#22c55e":"#ef4444";const h=Math.abs(v)/mx*100;g.fillRect(i*w+1,v>=0?110-h:110,w-2,h||1);});g.strokeStyle="#22314f";g.beginPath();g.moveTo(0,110);g.lineTo(c.width,110);g.stroke();}
async function admLogin(){ADM=$("admTok").value;try{await H("/api/admin/bots");sessionStorage.setItem("adm",ADM);$("who").textContent="admin";$("admLogin").classList.add("hidden");$("admBody").classList.remove("hidden");admLoad();}catch(e){alert("Token inválido");ADM="";}}
function admTab(t,el){document.querySelectorAll("#viewAdm .tabs button").forEach(b=>b.classList.remove("sel"));el.classList.add("sel");$("admBots").classList.toggle("hidden",t!=="bots");$("admNew").classList.toggle("hidden",t!=="new");$("admMkt").classList.toggle("hidden",t!=="mkt");if(t==="mkt")mktLoad();}
async function admLoad(){const d=await H("/api/admin/bots");$("admBots").innerHTML=d.map(b=>`<section class="panel"><b>${b.name}</b> <span class="st ${b.status}">${b.status}</span><div class="k">Estrategia: ${b.strategy} ${JSON.stringify(b.params)} · ${b.symbol} · ${b.timeframe} · prov ${b.provider} · cap $${b.capital} · lote ${b.lot} · max ${b.max_positions} · spread ${b.spread} · com ${b.commission}${b.costs_assumed?" (supuestos)":""}</div>
<div class="row" style="margin:8px 0"><button class="btn ghost" onclick="admBot('${b.bot_id}')">Detalle técnico</button><button class="btn ghost" onclick="admToggle('${b.bot_id}','${b.status}')">ON/OFF</button></div><div id="ad-${b.bot_id}"></div></section>`).join("")||'<div class="empty">Sin bots.</div>';}
async function admBot(id){const el=$("ad-"+id);el.innerHTML='<div class="skel" style="min-height:80px"></div>';const[st,sg]=await Promise.all([H(`/api/bots/${id}/stats`),H(`/api/admin/bots/${id}/signals`)]);el.innerHTML=`<div class="k">Balance $${st.balance} · Equity $${st.equity} · P&L $${st.pnl} (${st.pnl_pct}%) · ${st.total} ops · WR ${st.win_rate}% · PF ${st.profit_factor} · exp ${st.expectancy} · DD ${st.max_drawdown}% · rachas ${st.max_win_streak}/${st.max_loss_streak} · dur media ${st.avg_duration}s · BUY ${st.buys}/SELL ${st.sells}</div><div class="k">Señales internas (${sg.length}): ${sg.slice(0,5).map(s=>s.direction+"@"+s.price).join(", ")||"—"}</div>`;}
async function admToggle(id,st){await J(`/api/admin/bots/${id}`,{status:st==="running"?"stopped":"running"},"PATCH");admLoad();}
async function createBot(){const f=Object.fromEntries(new FormData($("frmBot")).entries());try{await J("/api/admin/bots",f);$("admMsg").textContent="Bot creado.";admLoad();}catch(e){$("admMsg").textContent="Error: revisa los campos.";}}
async function mktLoad(){try{const m=await H("/api/admin/market");$("mktInfo").innerHTML=`Proveedor app: <b>${m.provider}</b> · Activos: <b>${m.catalog_assets}</b> · Último sync: ${m.last_sync||"nunca"} · Necesita sync: ${m.needs_sync} · Modo CMC: ${m.client.mode} · Llamadas: ${m.client.calls} · 429: ${m.client.errors_429} · Último error: ${m.client.last_error||"—"}`;}catch(e){$("mktInfo").textContent="Error cargando estado.";}}
async function mktSync(){$("mktOut").innerHTML="Sincronizando…";try{const r=await J("/api/admin/market/sync",{});$("mktOut").innerHTML=`Sincronizados: ${r.synced} · Total: ${r.total}`;mktLoad();}catch(e){$("mktOut").innerHTML='<div class="error">Falló la sincronización.</div>';}}
async function mktSearch(){const q=$("mktQ").value;try{const r=await H(`/api/admin/market/assets?q=${encodeURIComponent(q)}`);$("mktOut").innerHTML="<table><tr><th>ID</th><th>Símbolo</th><th>Nombre</th><th>Rank</th><th>Precio</th><th>Vol 24h</th><th>MCap</th></tr>"+r.map(a=>`<tr><td>${a.cmc_id}</td><td>${a.symbol}</td><td>${a.name}</td><td>${a.rank}</td><td>${a.price}</td><td>${a.volume_24h}</td><td>${a.market_cap}</td></tr>`).join("")+"</table>";}catch(e){$("mktOut").innerHTML='<div class="error">Sin resultados.</div>';}}
async function mktResolve(){const q=$("mktQ").value;try{const a=await H(`/api/admin/market/resolve?q=${encodeURIComponent(q)}`);$("mktOut").innerHTML=`"${q}" → <b>${a.symbol}</b> (${a.name}) · CMC ID ${a.cmc_id} · rank ${a.rank}${a.on_demand?" · vía map on-demand":""}`;}catch(e){$("mktOut").innerHTML=`"${q}" → <b>no disponible</b> como instrumento utilizable.`;}}
if(ADM){$("who").textContent="admin";}
boot();setInterval(async()=>{try{BOTS=await H("/api/bots");if(!$("pubDetail").classList.contains("hidden")&&SEL){/* detalle bajo demanda */}else renderPub();}catch(e){}},20000);
</script>
</body>
</html>
