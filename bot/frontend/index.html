<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>StrategyIndex</title>
<style>
:root{--bg:#0b1220;--card:#141d31;--card2:#0f1729;--txt:#e9eff9;--mut:#8ea0bd;--up:#22c55e;--dn:#ef4444;--acc:#4f7cff;--line:#22314f;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Inter",system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:14px 16px;background:rgba(8,14,26,.95);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
.badge{padding:3px 10px;border-radius:20px;font-size:11px;background:#222f4d;color:var(--mut)}
.badge.on{background:rgba(34,197,94,.15);color:var(--up)}
.badge.off{background:rgba(239,68,68,.15);color:var(--dn)}
.hspace{flex:1}
.btn{background:var(--acc);color:#fff;border:none;border-radius:8px;padding:8px 14px;cursor:pointer;font-size:13px;-webkit-tap-highlight-color:transparent}
.btn:active{opacity:.7}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn.danger{background:rgba(239,68,68,.15);color:var(--dn);border:1px solid rgba(239,68,68,.3)}
main{max-width:900px;margin:0 auto;padding:16px calc(16px + env(safe-area-inset-left,0px)) calc(20px + var(--safe-b))}

.bot-list{display:flex;flex-direction:column;gap:10px}
.bot-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;transition:transform .15s,border-color .15s}
.bot-card:active{transform:scale(.98)}
.bot-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.bot-name{font-weight:700;font-size:15px}
.bot-pair{display:inline-flex;align-items:center;gap:4px;background:rgba(79,124,255,.1);color:var(--acc);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.bot-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.st{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.st.running{background:rgba(34,197,94,.15);color:var(--up)}
.st.stopped{background:rgba(142,160,189,.15);color:var(--mut)}
.st.WAITING_FOR_MARKET_DATA{background:rgba(251,191,36,.12);color:#fbbf24}
.st.ERROR{background:rgba(239,68,68,.15);color:var(--dn)}
.bot-balance{font-size:22px;font-weight:800;margin:4px 0 2px}
.bot-pnl{font-weight:700;font-size:13px}
.up{color:var(--up)}.dn{color:var(--dn)}
.bot-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.bot-stats .s{text-align:center}
.bot-stats .s .l{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.4px}
.bot-stats .s .v{display:block;font-size:13px;font-weight:600}

.empty{text-align:center;padding:40px 20px;color:var(--mut);border:1px dashed var(--line);border-radius:12px}
.empty h3{margin:0 0 6px;color:var(--txt);font-size:16px}
.k{color:var(--mut);font-size:12px}

section.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
table{width:100%;border-collapse:collapse;font-size:12px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.3px}
canvas.chart{width:100%;height:160px;background:#080e1a;border-radius:8px;border:1px solid var(--line)}
.detail-header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.detail-header h2{margin:0;font-size:18px}
.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.detail-grid .item{background:var(--card2);border-radius:8px;padding:8px;text-align:center}
.detail-grid .item .lbl{display:block;color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.3px}
.detail-grid .item .val{display:block;font-size:16px;font-weight:700;margin-top:2px}

.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tabs button{background:transparent;border:1px solid var(--line);color:var(--mut);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
.tabs button.sel{background:var(--acc);color:#fff;border-color:var(--acc)}
.hidden{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.adm{display:grid;grid-template-columns:1fr;gap:8px;margin:10px 0}
form.adm input,form.adm select{background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
.field{margin-bottom:10px}
.field label{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;font-weight:600}
.field input,.field select{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px}
.asset-item{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.asset-item:hover{border-color:var(--acc)}
.asset-item .sym{font-weight:700;color:var(--acc)}
.asset-item .name{color:var(--mut);font-size:12px}
</style>
</head>
<body>

<header>
<div class="logo">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M3 17l5-6 4 3 6-8" stroke="#4f7cff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 6h-4M18 6v4" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/></svg>
StrategyIndex</div>
<span id="cConn" class="badge off">offline</span>
<div class="hspace"></div>
<button id="admBtn" class="btn sm ghost">Admin</button>
</header>

<main>

<div id="viewPub">
<div id="pubList"></div>
<section id="pubDetail" class="hidden"></section>
</div>

<div id="viewLogin" class="hidden">
<section class="panel" style="max-width:400px;margin:20px auto">
<h3 style="margin:0 0 10px">Admin Login</h3>
<input id="admTok" type="password" placeholder="Token de administrador" style="width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:14px;margin-bottom:10px">
<button id="loginBtn" class="btn" style="width:100%">Entrar</button>
<div id="loginMsg" class="k" style="margin-top:8px;text-align:center"></div>
<button id="cancelBtn" class="btn ghost" style="width:100%;margin-top:6px">Cancelar</button>
</section>
</div>

<div id="viewAdm" class="hidden">
<div class="tabs"><button class="sel" id="tabBots">Bots</button><button id="tabNew">Crear bot</button><button id="admLogoutBtn" class="btn sm ghost" style="margin-left:auto">Salir</button></div>
<div id="admBots"></div>
<div id="admNew" class="hidden"><section class="panel">
<h3 style="margin:0 0 12px">Crear Bot</h3>
<div class="field"><label>Estrategia</label>
<select name="strategy_key" id="fStrategy"><option value="irk">Index Range Killer (EMA 75/150)</option><option value="irk_plus">Index Range Killer + (EMA 30/75/150)</option></select></div>
<div class="field"><label>Proveedor</label>
<select id="fProvider"><option value="coinmarketcap">CoinMarketCap (Criptomonedas)</option><option value="yahoo">Yahoo Finance (Acciones, Forex, Commodities)</option></select></div>
<div id="cmcFields">
<div class="field"><label>Buscar cripto en CMC</label>
<div style="display:flex;gap:6px"><input id="fAssetSearch" placeholder="BTC, Ethereum, SOL, Doge..." autocomplete="off"><button class="btn sm" id="fAssetBtn" type="button">Buscar</button></div>
<div id="fAssetResults" style="margin-top:6px"></div>
<input type="hidden" name="symbol" id="fSymbol"></div>
</div>
<div id="yahooFields" class="hidden">
<div class="field"><label>Activo</label>
<select id="fYahooSymbol">
<optgroup label="Acciones">
<option value="TSLA">Tesla (TSLA)</option>
<option value="AAPL">Apple (AAPL)</option>
<option value="NVDA">NVIDIA (NVDA)</option>
<option value="AMZN">Amazon (AMZN)</option>
<option value="GOOG">Google (GOOG)</option>
<option value="MSFT">Microsoft (MSFT)</option>
<option value="META">Meta (META)</option>
</optgroup>
<optgroup label="Indices">
<option value="NDX">NASDAQ 100 (^NDX)</option>
<option value="SPX">S&P 500 (^GSPC)</option>
<option value="DJI">Dow Jones (^DJI)</option>
</optgroup>
<optgroup label="Commodities">
<option value="GOLD">Oro (GC=F)</option>
<option value="SILVER">Plata (SI=F)</option>
<option value="OIL">Petróleo (CL=F)</option>
</optgroup>
<optgroup label="Forex">
<option value="EURUSD">EUR/USD</option>
<option value="GBPUSD">GBP/USD</option>
<option value="USDJPY">USD/JPY</option>
</optgroup>
<optgroup label="Cripto (Yahoo)">
<option value="BTC">Bitcoin (BTC-USD)</option>
<option value="ETH">Ethereum (ETH-USD)</option>
</optgroup>
</select></div>
</div>
<div class="field"><label>Temporalidad</label>
<select name="timeframe" id="fTimeframe"><option value="1m">1 minuto</option><option value="5m" selected>5 minutos</option><option value="15m">15 minutos</option><option value="30m">30 minutos</option><option value="1h">1 hora</option><option value="4h">4 horas</option></select></div>
<div class="field"><label>Capital inicial ($)</label><input name="capital" type="number" value="50" step="10" min="10"></div>
<div class="field"><label>Tamano de lote</label><input name="lot" type="number" value="0.01" step="0.01" min="0.001"></div>
<div class="field"><label>Maximo posiciones abiertas</label><input name="max_positions" type="number" value="1" min="1" max="10"></div>
<div style="margin-top:14px"><button id="createBotBtn" class="btn" disabled>Crear Bot</button></div>
<div id="admMsg" class="k" style="margin-top:8px"></div>
</section></div>
</div>

</main>

<script>
var $=function(id){return document.getElementById(id)};
var BOTS=[];
var ADM=sessionStorage.getItem("adm")||"";
var currentView="pub";

function apiGet(url){
  var h=ADM?{"X-Admin-Token":ADM}:{};
  return fetch(url,{headers:h}).then(function(r){if(!r.ok)throw r.status;return r.json()});
}
function apiPost(url,body,method){
  var h=Object.assign({"Content-Type":"application/json"},ADM?{"X-Admin-Token":ADM}:{});
  return fetch(url,{method:method||"POST",headers:h,body:JSON.stringify(body)}).then(function(r){if(!r.ok)throw r.status;return r.json()});
}

function pairColor(s){return{BTC:'#f7931a',ETH:'#627eea',SOL:'#9945ff',XAU:'#ffd700'}[s]||'#4f7cff';}

function showView(v){
  currentView=v;
  $("viewPub").className=v==="pub"?"":"hidden";
  $("viewLogin").className=v==="login"?"":"hidden";
  $("viewAdm").className=v==="adm"?"":"hidden";
  $("pubDetail").className="hidden";
}

function renderList(){
  if(!BOTS.length){
    $("pubList").innerHTML='<div class="empty"><h3>Sin bots</h3>No hay bots configurados. Inicia sesion como Admin para crear uno.</div>';
    return;
  }
  var html='<div class="bot-list">';
  for(var i=0;i<BOTS.length;i++){
    var b=BOTS[i];
    var c=pairColor(b.symbol);
    html+='<div class="bot-card" data-id="'+b.bot_id+'">';
    html+='<div class="bot-top"><span class="bot-name">'+b.name+'</span>';
    html+='<span class="bot-pair" style="color:'+c+';background:'+c+'15">'+b.symbol+'/'+b.timeframe+'</span></div>';
    html+='<div class="bot-meta"><span class="st '+b.status+'">'+b.status+'</span>';
    html+='<span class="st '+(b.state||'')+'">'+(b.state||'').replace(/_/g,' ')+'</span></div>';
    html+='<div class="bot-balance">$'+b.balance.toFixed(2)+'</div>';
    html+='<div class="bot-pnl '+(b.pnl>=0?'up':'dn')+'">'+(b.pnl>=0?'+':'')+b.pnl_pct.toFixed(2)+'% · $'+b.pnl.toFixed(2)+'</div>';
    html+='<div class="bot-stats">';
    html+='<div class="s"><span class="l">Ops</span><span class="v">'+b.total+'</span></div>';
    html+='<div class="s"><span class="l">Win</span><span class="v '+(b.win_rate>=50?'up':'dn')+'">'+b.win_rate+'%</span></div>';
    html+='<div class="s"><span class="l">DD</span><span class="v dn">'+b.max_drawdown+'%</span></div>';
    html+='</div></div>';
  }
  html+='</div>';
  $("pubList").innerHTML=html;
  var cards=document.querySelectorAll(".bot-card");
  for(var j=0;j<cards.length;j++){
    cards[j].addEventListener("click",function(){detail(this.getAttribute("data-id"));});
  }
}

async function detail(id){
  $("pubDetail").className="";
  $("pubDetail").innerHTML='<div style="padding:20px;color:var(--mut)">Cargando...</div>';
  try{
    var all=await apiGet("/api/bots");
    var st=await apiGet("/api/bots/"+id+"/stats");
    var h=await apiGet("/api/bots/"+id+"/history?limit=200");
    var b=null;
    for(var i=0;i<all.length;i++){if(all[i].bot_id===id){b=all[i];break;}}
    if(!b)b={name:id,symbol:"?",timeframe:"?",status:"?",state:""};
    var html='<div class="detail-header">';
    html+='<h2>'+b.name+'</h2>';
    html+='<span class="st '+b.status+'">'+b.status+'</span>';
    html+='<span class="st '+(b.state||'')+'">'+(b.state||'').replace(/_/g,' ')+'</span>';
    html+='<span class="bot-pair" style="color:'+pairColor(b.symbol)+';background:'+pairColor(b.symbol)+'15">'+b.symbol+'/'+b.timeframe+'</span>';
    html+='<button class="btn sm ghost" id="backBtn" style="margin-left:auto">Volver</button></div>';
    html+='<div class="detail-grid">';
    html+='<div class="item"><span class="lbl">Balance</span><span class="val">$'+st.balance.toFixed(2)+'</span></div>';
    html+='<div class="item"><span class="lbl">Equity</span><span class="val">$'+st.equity.toFixed(2)+'</span></div>';
    html+='<div class="item"><span class="lbl">P&L</span><span class="val '+(st.pnl>=0?'up':'dn')+'">'+(st.pnl>=0?'+':'')+'$'+st.pnl.toFixed(2)+'</span></div>';
    html+='<div class="item"><span class="lbl">P&L %</span><span class="val '+(st.pnl_pct>=0?'up':'dn')+'">'+st.pnl_pct.toFixed(2)+'%</span></div>';
    html+='<div class="item"><span class="lbl">Win Rate</span><span class="val">'+st.win_rate+'%</span></div>';
    html+='<div class="item"><span class="lbl">Profit Factor</span><span class="val">'+st.profit_factor+'</span></div>';
    html+='<div class="item"><span class="lbl">Max DD</span><span class="val dn">'+st.max_drawdown+'%</span></div>';
    html+='<div class="item"><span class="lbl">Expectancy</span><span class="val">'+st.expectancy+'</span></div>';
    html+='</div>';
    html+='<h4>Equity</h4><canvas class="chart" id="cEq"></canvas>';
    html+='<h4>Drawdown</h4><canvas class="chart" id="cDd"></canvas>';
    html+='<h4>Historial ('+h.length+')</h4>';
    html+='<table><tr><th>Dir</th><th>Entrada</th><th>Salida</th><th>P&L</th></tr>';
    if(h.length===0){html+='<tr><td colspan="4">Sin operaciones aun.</td></tr>';}
    for(var j=0;j<Math.min(h.length,50);j++){
      var t=h[j];
      html+='<tr><td><span class="st '+(t.direction==='BUY'?'running':'stopped')+'" style="font-size:10px">'+t.direction+'</span></td>';
      html+='<td>'+t.entry+'</td><td>'+(t.exit||'-')+'</td>';
      html+='<td class="'+((t.pnl||0)>=0?'up':'dn')+'">'+(t.pnl!=null?t.pnl:'-')+'</td></tr>';
    }
    html+='</table>';
    $("pubDetail").innerHTML=html;
    $("backBtn").addEventListener("click",function(){$("pubDetail").className="hidden";});
    drawChart("cEq",st.equity_curve,"#4f7cff");
    drawChart("cDd",st.drawdown_curve,"#ef4444");
    $("pubDetail").scrollIntoView({behavior:"smooth"});
  }catch(e){
    $("pubDetail").innerHTML='<div style="padding:20px;color:var(--dn)">Error cargando detalle.</div>';
  }
}

function drawChart(id,data,col){
  var c=$(id);if(!c)return;
  var g=c.getContext("2d");
  c.width=c.offsetWidth*2;c.height=320;g.scale(2,2);
  var w=c.offsetWidth,h=160;g.clearRect(0,0,w,h);
  if(!data||data.length<2){g.fillStyle="#8ea0bd";g.font="12px system-ui";g.fillText("Sin datos.",12,24);return;}
  var mn=Math.min.apply(null,data),mx=Math.max.apply(null,data);
  g.strokeStyle=col;g.lineWidth=2;g.beginPath();
  for(var i=0;i<data.length;i++){
    var x=8+i*(w-16)/(data.length-1);
    var y=12+(h-24)*(1-(data[i]-mn)/(mx-mn||1));
    if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
  }
  g.stroke();
}

async function loadBots(){try{BOTS=await apiGet("/api/bots");renderList();}catch(e){$("pubList").innerHTML='<div class="empty"><h3>Error</h3>No se pudieron cargar los datos.</div>';}$("cConn").textContent="online";$("cConn").className="badge on";}

async function admLoad(){
  try{
    var d=await apiGet("/api/admin/bots");
    if(!d.length){$("admBots").innerHTML='<div class="empty"><h3>Sin bots</h3>Crea tu primer bot con "Crear bot".</div>';return;}
    var html='';
    for(var i=0;i<d.length;i++){
      var b=d[i];
      html+='<section class="panel" style="margin-bottom:10px">';
      html+='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px">';
      html+='<b>'+b.name+'</b><div class="row">';
      html+='<span class="st '+b.status+'">'+b.status+'</span>';
      html+='<button class="btn sm ghost toggle-btn" data-id="'+b.bot_id+'" data-status="'+b.status+'">'+(b.status==='running'?'Pausar':'Reanudar')+'</button>';
      html+='<button class="btn sm danger delete-btn" data-id="'+b.bot_id+'">Borrar</button>';
      html+='</div></div>';
      html+='<div class="k" style="margin-top:4px">'+b.strategy+' · '+b.symbol+' · '+b.timeframe+' · $'+b.capital+'</div>';
      html+='</section>';
    }
    $("admBots").innerHTML=html;
    var toggles=document.querySelectorAll(".toggle-btn");
    for(var j=0;j<toggles.length;j++){toggles[j].addEventListener("click",function(){admToggle(this.getAttribute("data-id"),this.getAttribute("data-status"));});}
    var deletes=document.querySelectorAll(".delete-btn");
    for(var k=0;k<deletes.length;k++){deletes[k].addEventListener("click",function(){admDelete(this.getAttribute("data-id"));});}
  }catch(e){$("admBots").innerHTML='<div style="color:var(--dn);padding:20px">Error de conexion con admin.</div>';}
}

function admToggle(id,st){apiPost("/api/admin/bots/"+id,{status:st==="running"?"stopped":"running"},"PATCH").then(function(){admLoad();});}
function admDelete(id){if(!confirm("Borrar este bot?"))return;apiPost("/api/admin/bots/"+id,{},"DELETE").then(function(){admLoad();});}

var _selectedAsset=null;
function searchAssets(){
  var q=$("fAssetSearch").value.trim();
  if(q.length<2){$("fAssetResults").innerHTML='<div class="k">Escribe al menos 2 letras</div>';return;}
  $("fAssetResults").innerHTML='<div class="k">Buscando...</div>';
  apiGet("/api/admin/market/assets?q="+encodeURIComponent(q)+"&limit=8").then(function(r){
    if(!r||!r.length){$("fAssetResults").innerHTML='<div class="k">Sin resultados para "'+q+'". Intenta: BTC, ETH, SOL</div>';return;}
    var html='';
    for(var i=0;i<r.length;i++){
      var a=r[i];
      html+='<div class="asset-item" data-sym="'+a.symbol+'" data-id="'+a.cmc_id+'">';
      html+='<span><span class="sym">'+a.symbol+'</span> <span class="name">'+a.name+'</span></span>';
      html+='<span class="k">#'+a.rank+(a.price?' · $'+parseFloat(a.price).toFixed(2):'')+'</span></div>';
    }
    $("fAssetResults").innerHTML=html;
    var items=document.querySelectorAll(".asset-item");
    for(var j=0;j<items.length;j++){
      items[j].addEventListener("click",function(){
        var sym=this.getAttribute("data-sym");
        _selectedAsset=sym;
        $("fSymbol").value=sym;
        $("fAssetSearch").value=sym+" (seleccionado)";
        $("fAssetResults").innerHTML='<div class="k" style="color:var(--up)">✓ '+sym+' seleccionado</div>';
        $("createBotBtn").disabled=false;
      });
    }
  }).catch(function(e){
    $("fAssetResults").innerHTML='<div class="k" style="color:var(--dn)">Error de conexion. Intenta de nuevo.</div>';
  });
}

function switchProvider(){
  var p=$("fProvider").value;
  if(p==="yahoo"){
    $("cmcFields").className="hidden";
    $("yahooFields").className="";
    _selectedAsset=$("fYahooSymbol").value;
    $("createBotBtn").disabled=false;
  }else{
    $("cmcFields").className="";
    $("yahooFields").className="hidden";
    _selectedAsset=null;$("fSymbol").value="";$("fAssetSearch").value="";$("fAssetResults").innerHTML="";
    $("createBotBtn").disabled=true;
  }
}

async function createBot(){
  var provider=$("fProvider").value;
  var symbol=provider==="yahoo"?$("fYahooSymbol").value:_selectedAsset;
  if(!symbol){$("admMsg").textContent="Selecciona un activo primero.";$("admMsg").className="dn";return;}
  var f={strategy_key:$("fStrategy").value,symbol:symbol,provider:provider,timeframe:$("fTimeframe").value,capital:parseFloat(document.querySelector('[name=capital]').value)||50,lot:parseFloat(document.querySelector('[name=lot]').value)||0.01,max_positions:parseInt(document.querySelector('[name=max_positions]').value)||1};
  $("createBotBtn").disabled=true;
  $("admMsg").textContent="Creando bot...";$("admMsg").className="k";
  try{
    var r=await apiPost("/api/admin/bots",f);
    $("admMsg").textContent="Bot creado: "+r.bot_id+" ("+r.symbol+"/"+r.timeframe+")";
    $("admMsg").className="up";
    admLoad();
    _selectedAsset=null;$("fSymbol").value="";$("fAssetSearch").value="";$("fAssetResults").innerHTML="";$("createBotBtn").disabled=true;
  }catch(e){
    var msg="Error desconocido";
    if(typeof e==="number")msg="Error HTTP "+e;
    else if(e&&e.message)msg=e.message;
    else if(e&&e.detail)msg=e.detail;
    $("admMsg").textContent=msg;$("admMsg").className="dn";
    $("createBotBtn").disabled=false;
  }
}

function init(){
  $("admBtn").addEventListener("click",function(){
    if(ADM){showView("adm");admLoad();}
    else{showView("login");$("admTok").value="";$("admTok").focus();}
  });
  $("loginBtn").addEventListener("click",function(){
    var tok=$("admTok").value.trim();
    if(!tok){$("loginMsg").textContent="Escribe el token.";return;}
    ADM=tok;
    apiGet("/api/admin/bots").then(function(){
      sessionStorage.setItem("adm",ADM);
      $("loginMsg").textContent="";
      showView("adm");admLoad();
    }).catch(function(){
      $("loginMsg").textContent="Token invalido.";$("loginMsg").style.color="var(--dn)";
      ADM="";
    });
  });
  $("admTok").addEventListener("keydown",function(e){if(e.key==="Enter")$("loginBtn").click();});
  $("cancelBtn").addEventListener("click",function(){showView("pub");});
  $("admLogoutBtn").addEventListener("click",function(){ADM="";sessionStorage.removeItem("adm");showView("pub");loadBots();});
  $("tabBots").addEventListener("click",function(){$("tabBots").className="sel";$("tabNew").className="";$("admBots").className="";$("admNew").className="hidden";});
  $("tabNew").addEventListener("click",function(){$("tabNew").className="sel";$("tabBots").className="";$("admNew").className="";$("admBots").className="hidden";});
  $("createBotBtn").addEventListener("click",function(e){e.preventDefault();createBot();});
  $("fProvider").addEventListener("change",switchProvider);
  $("fYahooSymbol").addEventListener("change",function(){_selectedAsset=this.value;$("createBotBtn").disabled=false;});
  $("fAssetBtn").addEventListener("click",function(){searchAssets();});
  $("fAssetSearch").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();searchAssets();}});

  showView("pub");
  loadBots();
}

init();
setInterval(function(){if(currentView==="pub")loadBots();},20000);
</script>
</body>
</html>
